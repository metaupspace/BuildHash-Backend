services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: builddash
      POSTGRES_USER: builddash
      POSTGRES_PASSWORD: builddash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"https://medium.com/from-tutorials-to-real-applications/spring-data-jpa-for-beginners-who-want-to-build-real-applications-not-just-demos-47f4e1ed4de3
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
