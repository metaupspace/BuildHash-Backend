server:
  port: 8080

spring:
  application:
    name: builddash-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:builddash}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: builddash-backend
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    guest-token-ttl-hours: ${GUEST_TOKEN_TTL_HOURS:24}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

otp:
  length: 6
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  send-cooldown-seconds: ${OTP_SEND_COOLDOWN_SECONDS:60}
  rate-limit-per-hour: ${OTP_RATE_LIMIT_PER_HOUR:5}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
