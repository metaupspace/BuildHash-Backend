server:
  port: ${PORT:8081}

spring:
  application:
    name: builddash-backend

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "scheduled-task-"

  # 9-C locked resource limits: PO uploads are XLSX files capped at 2MB (the
  # business rule is also enforced in the application layer, so these servlet
  # bounds are the outer fence, not the rule itself).
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:builddash}
    username: ${DB_USER:builddash}
    password: ${DB_PASSWORD:builddash}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: 300000
      max-lifetime: 1800000

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: builddash-backend
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    guest-token-ttl-hours: ${GUEST_TOKEN_TTL_HOURS:24}
  pii:
    # FAIL CLOSED, NO DEFAULT (PLAN_PHASE8 decision 2): unset PII_MASTER_KEY refuses boot.
    master-key: ${PII_MASTER_KEY}
  rate-limit:
    rules:
      search:          { path: "/search/**", limit: 30, window: 1m }
      google:          { path: "/auth/google", method: POST, limit: 10, window: 1m }
      review-create:   { path: "/products/{id}/reviews", method: POST, limit: 10, window: 1m }
      question-create: { path: "/products/{id}/questions", method: POST, limit: 10, window: 1m }
      answer-create:   { path: "/questions/{id}/answers", method: POST, limit: 10, window: 1m }
      ticket-create:   { path: "/support/tickets", method: POST, limit: 10, window: 1m }
      return-create:   { path: "/orders/{id}/return", method: POST, limit: 10, window: 1m }

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

account:
  deletion:
    grace-days: ${ACCOUNT_DELETION_GRACE_DAYS:30}
    # OQ-9 (product/legal decision): HARD_DELETE is the executable default; flipping to
    # RETAIN is a one-config change — AccountDeletionSweeper reads this at classification time.
    support-tickets: ${ACCOUNT_DELETION_SUPPORT_TICKETS:HARD_DELETE}

orders:
  idempotency-window-hours: ${ORDERS_IDEMPOTENCY_WINDOW_HOURS:24}

delivery:
  webhook-api-key: ${DELIVERY_WEBHOOK_API_KEY:}
  modification-window-minutes: ${DELIVERY_MODIFICATION_WINDOW_MINUTES:15}

approval:
  escalation:
    stage-hours: ${APPROVAL_ESCALATION_STAGE_HOURS:24}
    sweep-interval-ms: ${APPROVAL_ESCALATION_SWEEP_INTERVAL_MS:60000}

statement:
  scheduler:
    delay-ms: ${STATEMENT_SCHEDULER_DELAY_MS:300000}
  generation:
    max-attempts: ${STATEMENT_GENERATION_MAX_ATTEMPTS:3}
    stale-minutes: ${STATEMENT_GENERATION_STALE_MINUTES:15}
    sweep-batch-limit: ${STATEMENT_GENERATION_SWEEP_BATCH_LIMIT:25}
  email:
    max-attempts: ${STATEMENT_EMAIL_MAX_ATTEMPTS:5}
    max-attachment-bytes: ${STATEMENT_EMAIL_MAX_ATTACHMENT_BYTES:10485760}
    sweep-batch-limit: ${STATEMENT_EMAIL_SWEEP_BATCH_LIMIT:25}

notification:
  cart-abandonment:
    after-minutes: ${NOTIFICATION_CART_ABANDONMENT_AFTER_MINUTES:60}
    poll-interval-ms: ${NOTIFICATION_CART_ABANDONMENT_POLL_INTERVAL_MS:300000}
    renotify-cooldown-hours: ${NOTIFICATION_CART_ABANDONMENT_RENOTIFY_COOLDOWN_HOURS:24}
  sweep:
    stuck-after-minutes: ${NOTIFICATION_SWEEP_STUCK_AFTER_MINUTES:10}
    interval-ms: ${NOTIFICATION_SWEEP_INTERVAL_MS:60000}

support:
  sla:
    ORDER_ISSUE: ${SUPPORT_SLA_ORDER_ISSUE_HOURS:24h}
    PAYMENT_ISSUE: ${SUPPORT_SLA_PAYMENT_ISSUE_HOURS:4h}
    RETURN_REFUND_ISSUE: ${SUPPORT_SLA_RETURN_REFUND_ISSUE_HOURS:24h}
    DELIVERY_ISSUE: ${SUPPORT_SLA_DELIVERY_ISSUE_HOURS:4h}
    PRODUCT_QUERY: ${SUPPORT_SLA_PRODUCT_QUERY_HOURS:48h}
    OTHER: ${SUPPORT_SLA_OTHER_HOURS:48h}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

otp:
  length: 6
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  send-cooldown-seconds: ${OTP_SEND_COOLDOWN_SECONDS:60}
  rate-limit-per-hour: ${OTP_RATE_LIMIT_PER_HOUR:5}

storage:
  s3:
    # Credentials have no default (H0.1): missing/blank keys fail startup instead of
    # silently using world-known MinIO defaults. Local dev supplies them via env.
    bucket: ${S3_BUCKET:builddash-invoices}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html


