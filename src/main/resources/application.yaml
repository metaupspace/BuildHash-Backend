server:
  port: ${PORT:8081}

spring:
  application:
    name: builddash-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:builddash}
    username: ${DB_USER:builddash}
    password: ${DB_PASSWORD:builddash}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: builddash-backend
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    guest-token-ttl-hours: ${GUEST_TOKEN_TTL_HOURS:24}
  pii:
    # FAIL CLOSED, NO DEFAULT (PLAN_PHASE8 decision 2): unset PII_MASTER_KEY refuses boot.
    master-key: ${PII_MASTER_KEY}
  rate-limit:
    rules:
      search:    { path: /search/**,  limit: 30, window: 1m }
      google:    { path: /auth/google, method: POST, limit: 10, window: 1m }

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

delivery:
  webhook-api-key: ${DELIVERY_WEBHOOK_API_KEY:}
  modification-window-minutes: ${DELIVERY_MODIFICATION_WINDOW_MINUTES:15}

notification:
  cart-abandonment:
    after-minutes: ${NOTIFICATION_CART_ABANDONMENT_AFTER_MINUTES:60}
    poll-interval-ms: ${NOTIFICATION_CART_ABANDONMENT_POLL_INTERVAL_MS:300000}
    renotify-cooldown-hours: ${NOTIFICATION_CART_ABANDONMENT_RENOTIFY_COOLDOWN_HOURS:24}
  sweep:
    stuck-after-minutes: ${NOTIFICATION_SWEEP_STUCK_AFTER_MINUTES:10}
    interval-ms: ${NOTIFICATION_SWEEP_INTERVAL_MS:60000}

support:
  sla:
    ORDER_ISSUE: ${SUPPORT_SLA_ORDER_ISSUE_HOURS:24h}
    PAYMENT_ISSUE: ${SUPPORT_SLA_PAYMENT_ISSUE_HOURS:4h}
    RETURN_REFUND_ISSUE: ${SUPPORT_SLA_RETURN_REFUND_ISSUE_HOURS:24h}
    DELIVERY_ISSUE: ${SUPPORT_SLA_DELIVERY_ISSUE_HOURS:4h}
    PRODUCT_QUERY: ${SUPPORT_SLA_PRODUCT_QUERY_HOURS:48h}
    OTHER: ${SUPPORT_SLA_OTHER_HOURS:48h}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

otp:
  length: 6
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  send-cooldown-seconds: ${OTP_SEND_COOLDOWN_SECONDS:60}
  rate-limit-per-hour: ${OTP_RATE_LIMIT_PER_HOUR:5}

storage:
  s3:
    bucket: ${S3_BUCKET:builddash-invoices}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadminpassword}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html


