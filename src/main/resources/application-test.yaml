spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  jpa:
    properties:
      hibernate:
        generate_statistics: true

security:
  jwt:
    secret: test-only-insecure-secret-change-me-0123456789

google:
  client-id: test-google-client-id

otp:
  send-cooldown-seconds: 0

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false

payment:
  webhook-secret: test-only-webhook-secret-0123456789abcdef

storage:
  s3:
    bucket: test-bucket
    region: ap-south-1
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    path-style-access: true

